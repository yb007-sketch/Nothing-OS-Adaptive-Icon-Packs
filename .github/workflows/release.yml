name: Publish GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release & Upload APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6
          name: Nothing OS 5.0 Adaptive Icons v0.6
          body: |
            ## ⚡ Nothing OS 5.0 Adaptive Icon Packs (v0.6)
            
            Production-ready standalone APKs crafted for Nothing OS 5.0 liquid glass aesthetics and Samsung One UI 9.0 (Theme Park).
            
            ### 📥 Direct APK Downloads:
            - **Nothing Translucent Icons** (`Nothing.Translucent.Icons.v0.6.apk` - 44.0 MB)
              - *Liquid frosted translucent glass plate with dynamic glyphs*
              - Package: `com.yb007.nothingicons.translucent`
            - **Nothing Pure White Icons** (`Nothing.Pure.White.Icons.v0.6.apk` - 26.9 MB)
              - *Solid #FFFFFF daylight ceramic plate with charcoal glyphs (0% translucent bleed)*
              - Package: `com.yb007.nothingicons.purewhite`
            - **Nothing Pitch Black Icons** (`Nothing.Pitch.Black.Icons.v0.6.apk` - 26.9 MB)
              - *Solid #0D0D0D pitch dark plate with white glyphs (AMOLED battery saver)*
              - Package: `com.yb007.nothingicons.pitchblack`
            
            ---
            
            ### 🚀 Verification & Features:
            - ✅ **100% App Coverage**: 10,640+ package components mapped (0 unmatched apps).
            - ✅ **Unthemed App Squircle Masking**: `iconback.png` + `iconmask.png` automatically squircle-frames unmapped shortcuts.
            - ✅ **Theme Park Ready**: Standalone app IDs allow seamless selection in Good Lock Theme Park.
            - ✅ **Signed**: Dual V1 + V2 + V3 cryptographically signed for Android 14 to 17.
          files: |
            apks/Nothing.Translucent.Icons.v0.6.apk
            apks/Nothing.Pure.White.Icons.v0.6.apk
            apks/Nothing.Pitch.Black.Icons.v0.6.apk
          fail_on_unmatched_files: true
